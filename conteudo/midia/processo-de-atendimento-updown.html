<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Atendimento UpDown</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ===== 1. CORES E TEMA =====
   Marca: azul #0B0FEE, marinho #140075, ciano #0BBBEF, roxo #9B00FF, preto #1A1818 */
:root{
  --cy:#0BBBEF; --pu:#9B00FF; --bl:#0B0FEE; --navy:#140075; --ink:#1A1818;
  --bg:#EEF1F8; --panel:#FFFFFF; --soft:#F6F7FC; --line:#DFE3F0; --text:#1A1818; --muted:#5A5F75;
  --side:#140075; --side-text:#DADCFF; --side-muted:#8C8FC9; --side-line:#2B2390;
  --fiber:linear-gradient(180deg,#0BBBEF,#0B0FEE 55%,#9B00FF);
  --r-lg:18px; --r-md:12px; --r-sm:8px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#08061C; --panel:#120F30; --soft:#18153D; --line:#2A2660; --text:#EEF0FF; --muted:#A3A6CC; --navy:#D4D6FF;
  --side:#0D0A28; --side-line:#2A2660; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#08061C; --panel:#120F30; --soft:#18153D; --line:#2A2660; --text:#EEF0FF; --muted:#A3A6CC; --navy:#D4D6FF;
  --side:#0D0A28; --side-line:#2A2660; color-scheme:dark;
}

/* ===== 2. BASE ===== */
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%}
body{min-height:100%;background:var(--bg);color:var(--text);font-family:Poppins,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;-webkit-font-smoothing:antialiased}
.wm{position:fixed;inset:0;pointer-events:none;background-repeat:repeat;background-size:220px;opacity:.03}
:root[data-theme="dark"] .wm{opacity:.05}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .wm{opacity:.05} }
.wrap,header{position:relative}
.bar{height:4px;background:linear-gradient(90deg,var(--cy),var(--bl),var(--pu))}
:focus-visible{outline:3px solid var(--cy);outline-offset:2px}
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }

/* ===== 3. TOPO (logo, titulo, botoes) ===== */
header{display:flex;align-items:center;gap:16px 24px;justify-content:space-between;padding:20px 28px;max-width:1320px;margin:0 auto;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:18px}
.brand img{height:38px;width:auto}
.brand span{font-size:18px;font-weight:600;color:var(--navy);letter-spacing:-.01em;padding-left:18px;border-left:1px solid var(--line)}
.tools{display:flex;gap:6px;flex-wrap:wrap}
/* pesquisa */
[hidden]{display:none!important}
.search{position:relative;flex:1 1 280px;max-width:440px;margin-left:auto}
.search svg{position:absolute;left:14px;top:50%;width:17px;height:17px;transform:translateY(-50%);fill:none;stroke:var(--muted);stroke-width:2.2;stroke-linecap:round;pointer-events:none}
.search input{width:100%;font:inherit;font-size:14px;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:9px 40px 9px 40px;outline:none}
.search input:focus{border-color:var(--bl);box-shadow:0 0 0 3px color-mix(in srgb,var(--bl) 18%,transparent)}
.search input::-webkit-search-cancel-button{display:none}
.search kbd{position:absolute;right:12px;top:50%;transform:translateY(-50%);font:600 11px/1 inherit;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:3px 6px;background:var(--soft)}
.search input:focus ~ kbd{display:none}
.sres{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:40;max-height:min(70vh,520px);overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:0 18px 40px -16px rgba(20,0,117,.45);padding:6px}
.sres button{display:flex;flex-direction:column;align-items:flex-start;gap:3px;width:100%;text-align:left;border:none;border-radius:var(--r-sm);background:transparent;padding:9px 12px;color:var(--text);font-weight:400}
.sres button:hover,.sres button.on{background:var(--soft);color:var(--text)}
.sres .r-where{font-size:11.5px;font-weight:600;color:var(--c)}
.sres .r-title{font-size:13.5px;font-weight:600;line-height:1.35}
.sres .r-snip{font-size:12.5px;line-height:1.45;color:var(--muted)}
.sres mark{background:color-mix(in srgb,var(--cy) 30%,transparent);color:inherit;border-radius:3px;padding:0 1px}
.sres .r-none{padding:12px;font-size:13.5px;color:var(--muted)}
.flash{animation:flash 1.6s ease-out}
@media (prefers-reduced-motion: reduce){ .flash{animation:none} }
@keyframes flash{0%,40%{background:color-mix(in srgb,var(--cy) 18%,transparent)}100%{background:transparent}}
@media (max-width:640px){ .search{order:3;flex-basis:100%;max-width:none;margin-left:0} }
button{font-family:inherit;font-size:13.5px;font-weight:500;border:1px solid var(--line);background:var(--panel);color:var(--text);padding:9px 16px;border-radius:999px;cursor:pointer;transition:background .15s,border-color .15s,color .15s}
button:hover{border-color:var(--bl);color:var(--bl)}
button.primary{background:var(--bl);border-color:var(--bl);color:#fff;font-weight:600}
button.primary:hover{background:var(--navy);border-color:var(--navy);color:#fff}
:root[data-theme="dark"] button.primary:hover{background:var(--pu);border-color:var(--pu)}
button:disabled{opacity:.35;cursor:default}
button:disabled:hover{border-color:var(--line);color:var(--text)}
.wrap{max-width:1320px;margin:0 auto;padding:0 28px 48px}
h1{display:none}

/* ===== 4. LAYOUT E TRILHA DE ETAPAS (a fibra) ===== */
.layout{display:grid;grid-template-columns:280px minmax(0,1fr);gap:24px;align-items:start}
.layout:has(.flowview.on){grid-template-columns:minmax(0,1fr)}
.layout:has(.flowview.on) .side{display:none}
.side{position:sticky;top:16px;background:var(--side);border-radius:var(--r-lg);padding:22px 18px 18px;color:var(--side-text)}
.side-t{font-size:13px;font-weight:500;color:var(--side-muted);margin:0 0 14px 6px}
.progress,.pmeta{display:none}
.rail{display:flex;flex-direction:column}
.rail button{position:relative;display:flex;align-items:center;gap:14px;width:100%;border:none;border-radius:var(--r-md);background:transparent;padding:10px 8px;text-align:left;color:var(--side-text)!important}
.rail button:hover{background:rgba(255,255,255,.06);color:#fff!important}
/* fio entre os pontos */
.rail button:not(:last-child)::after{content:'';position:absolute;left:21px;top:40px;bottom:-8px;width:2px;border-radius:2px;background:var(--side-line)}
.rail button:has(~ button[aria-current="true"])::after{background:var(--fiber)}
.rail button .num{position:relative;z-index:1;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:12.5px;font-weight:700;flex:0 0 auto;color:#fff;box-shadow:0 0 0 3px var(--side)}
/* etapas seguintes: ponto vazado */
.rail button[aria-current="true"] ~ button .num{background:var(--side)!important;color:var(--side-muted);box-shadow:inset 0 0 0 2px var(--side-line),0 0 0 3px var(--side)}
.rail button[aria-current="true"] ~ button .lb{color:var(--side-muted)}
.rail button .lb{font-size:12.5px;font-weight:500;line-height:1.3;white-space:normal}
.rail button[aria-current="true"]{background:rgba(255,255,255,.08)}
.rail button[aria-current="true"] .lb{color:#fff;font-weight:600}
.rail button[aria-current="true"] .num{box-shadow:0 0 0 3px var(--side),0 0 0 6px rgba(11,187,239,.35),0 0 18px 4px rgba(11,187,239,.45)}

/* ===== 5. CARTAO DA ETAPA E LISTA ===== */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:clamp(22px,3.2vw,40px);border-top:5px solid var(--acc,var(--bl))}
.etapa{display:block;font-size:13.5px;font-weight:500;color:var(--muted);letter-spacing:0;text-transform:none;padding:0;background:none!important}
h2{font-size:clamp(24px,3.4vw,36px);line-height:1.12;font-weight:700;letter-spacing:-.015em;margin:6px 0 26px;max-width:22ch}
ol{list-style:none;counter-reset:item;display:flex;flex-direction:column}
ol>li{counter-increment:item;display:flex;gap:16px;align-items:flex-start;padding:18px 0;border-top:1px solid var(--line);font-size:15.5px;line-height:1.55}
ol>li:first-child{border-top:none;padding-top:4px}
ol>li::before{content:counter(item);flex:0 0 auto;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--acc);box-shadow:inset 0 0 0 2px var(--acc);margin-top:-2px}
ol>li>.li-body>.li-h b{font-weight:600}
.li-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px}
.li-h{font-weight:500;max-width:70ch}
ul.sub{list-style:none;display:flex;flex-direction:column;gap:7px}
ul.sub li{position:relative;padding-left:18px;font-size:14.5px;line-height:1.55;color:var(--muted);max-width:75ch}
ul.sub li::before{content:"";position:absolute;left:2px;top:10px;width:6px;height:2px;border-radius:2px;background:var(--acc)}
ul.sub li b,ul.sub li strong{color:var(--text);font-weight:600}
.fold-h{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;max-width:none;border:none;background:transparent;padding:0;font:inherit;font-weight:500;color:inherit;text-align:left;cursor:pointer;border-radius:0}
.fold-h:hover{color:var(--acc);border:none}
.fold-h .chev{flex:0 0 auto;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:16px;line-height:1;color:var(--acc);box-shadow:inset 0 0 0 1px var(--line)}
.fold-h[aria-expanded="true"] .chev{background:var(--acc);color:#fff;box-shadow:none}
.fold-body{display:none;flex-direction:column;gap:12px;padding-top:4px}
.fold-body.on{display:flex}
.pairs{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;max-width:620px}
.pairs span{display:flex;justify-content:space-between;align-items:center;gap:8px;border-radius:var(--r-sm);padding:8px 12px;font-size:13px;font-weight:600;color:var(--pc);background:var(--soft);box-shadow:inset 3px 0 0 var(--pc)}
.pairs b{color:var(--text);font-weight:600}
.pairs .p24{--pc:var(--cy)}
.pairs .p5{--pc:var(--pu)}
.shot{display:flex;flex-direction:column;gap:8px;margin-top:2px}
.shot img{display:block;max-width:min(100%,600px);height:auto;border:1px solid var(--line);border-radius:var(--r-md);background:#fff;cursor:zoom-in;box-shadow:0 8px 24px -12px rgba(20,0,117,.35)}
.zoom{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:24px;background:rgba(8,6,28,.85);cursor:zoom-out}
.zoom img{max-width:100%;max-height:100%;border-radius:var(--r-md);background:#fff}
.shots2{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-items:start}
@media (min-width:700px){ .shots2{grid-template-columns:minmax(0,2fr) minmax(0,1fr)} }
.sig-g:has(.shots2){max-width:none}
.shots2 .shot img{max-width:100%}
.shot-t{font-size:12.5px;font-weight:600;color:var(--acc)}
.shot figcaption{font-size:13.5px;line-height:1.5;color:var(--muted);max-width:75ch}

/* ===== 6. DESTAQUE E PAINEIS EXPANSIVEIS ===== */
li.is-hi{background:var(--soft);border-radius:var(--r-md);padding-left:14px;padding-right:14px}
.hi-tag{margin-left:10px;display:inline-block;vertical-align:middle;font-size:11.5px;font-weight:600;color:#fff;background:var(--acc);padding:3px 10px;border-radius:999px}
.accs{display:flex;flex-direction:column;gap:10px;margin-top:22px}
.acc{border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;background:var(--panel)}
.acc-h{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;border:none;border-radius:0;background:transparent;padding:16px 20px;font-size:15.5px;font-weight:600;color:var(--text);text-align:left;box-shadow:inset 4px 0 0 var(--acc)}
.acc-h:hover{color:var(--acc);background:var(--soft)}
.acc-h .chev{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:16px;line-height:1;color:var(--acc);box-shadow:inset 0 0 0 1px var(--line)}
.acc-h[aria-expanded="true"]{background:var(--soft);color:var(--acc)}
.acc-h[aria-expanded="true"] .chev{background:var(--acc);color:#fff;box-shadow:none}
.acc .panel.on{padding:6px 20px 20px;background:var(--soft)}
.panel{display:none}
.panel.on{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.block{border-radius:var(--r-md);padding:16px 18px;background:var(--panel);border:1px solid var(--line)}
.block h3{font-size:14px;font-weight:600;color:var(--acc);margin-bottom:10px;letter-spacing:0;text-transform:none}
.block ul{list-style:none;display:flex;flex-direction:column;gap:8px}
.block li{position:relative;padding-left:16px;font-size:14px;line-height:1.5;color:var(--text);border:none;background:none;padding-top:0;padding-bottom:0}
.block li::before{content:'';position:absolute;left:0;top:10px;width:6px;height:2px;border-radius:2px;background:var(--acc)}

/* ===== 7. LOGS E SINAIS ===== */
.logs{margin-top:22px;border:1px solid var(--line);border-radius:var(--r-lg);padding:22px;background:var(--soft)}
.logs-h{font-size:17px;font-weight:600;color:var(--navy);margin-bottom:14px;letter-spacing:0;text-transform:none}
.logcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.logcard{border-radius:var(--r-md);padding:16px 18px;background:var(--panel);border:1px solid var(--line);box-shadow:inset 0 4px 0 var(--lc)}
.logcard-top{display:flex;align-items:center;gap:9px;margin-bottom:8px}
.logdot{width:9px;height:9px;border-radius:50%;background:var(--lc);flex:0 0 auto;box-shadow:0 0 0 4px color-mix(in srgb,var(--lc) 18%,transparent)}
.logcard-top b{font-size:14.5px;font-weight:700;color:var(--lc);letter-spacing:.01em}
.log-d{font-size:14px;line-height:1.5;color:var(--text)}
.log-m{font-size:13.5px;line-height:1.5;color:var(--muted);margin-top:8px}
.log-m b{color:var(--text);font-weight:600}
.logs .logs-h+.logcards{margin-bottom:4px}
.log-ex{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;line-height:1.7;background:#0D0A28;border:none;border-radius:var(--r-md);padding:14px 16px;overflow-x:auto;white-space:pre;color:#CFEFFF;max-width:680px}
.sig{display:flex;flex-direction:column;gap:6px;max-width:560px}
.sig-row{display:flex;align-items:center;gap:14px;border-radius:var(--r-sm);padding:9px 14px;background:var(--soft);box-shadow:inset 4px 0 0 var(--sc)}
.sig-r{font-size:13.5px;font-weight:600;color:var(--text);min-width:140px;font-variant-numeric:tabular-nums}
.sig-l{font-size:13.5px;font-weight:600;color:var(--sc)}
.sig:has(.sig-d){max-width:780px}
.sig:has(.sig-d) .sig-l{min-width:96px}
.sig-d{font-size:13.5px;line-height:1.45;color:var(--muted);flex:1}
.sig-g{display:flex;flex-direction:column;gap:10px;max-width:780px;padding:18px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--panel)}
.sig-h{font-size:15px;font-weight:600;color:var(--acc);letter-spacing:0;text-transform:none}
.sig-p{font-size:14px;line-height:1.5;color:var(--text)}
.sig-chips{display:flex;flex-wrap:wrap;gap:8px}
.sig-chips span{display:flex;flex-direction:column;border-radius:var(--r-sm);padding:8px 12px;background:var(--soft);min-width:110px}
.sig-chips small{font-size:12px;font-weight:500;color:var(--muted)}
.sig-chips b{font-size:14px;color:var(--text)}
@media (max-width:640px){ .sig-row:has(.sig-d){flex-wrap:wrap;gap:4px 12px} .sig-d{flex-basis:100%} }
.inote{font-size:14px;line-height:1.5;color:var(--text);padding:10px 14px;background:color-mix(in srgb,var(--acc) 9%,var(--panel));border-radius:var(--r-sm);max-width:75ch}
.log-note{margin-top:16px;font-size:14px;line-height:1.55;color:var(--text);padding:12px 16px;background:var(--panel);border-radius:var(--r-sm);border:1px solid var(--line)}
.log-note b{color:var(--acc)}

/* ===== 8. FLUXOGRAMA E ONBOARDING ===== */
.onb{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.onbcard{border:1px solid var(--line);border-radius:var(--r-md);padding:18px;display:flex;flex-direction:column;gap:10px;background:var(--panel);box-shadow:inset 0 4px 0 var(--c)}
.onbcard .fn-n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:13px;font-weight:700;background:var(--c)}
.onbcard h4{font-size:15px;font-weight:700;color:var(--c);line-height:1.25}
.onbcard ul{list-style:none;display:flex;flex-direction:column;gap:8px}
.onbcard li{position:relative;padding-left:16px;font-size:13.5px;line-height:1.55;color:var(--text);border:none}
.onbcard li::before{content:'';position:absolute;left:0;top:10px;width:6px;height:2px;border-radius:2px;background:var(--c)}
.flowview{display:none}
.flowview.on{display:block;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:clamp(20px,3vw,36px)}
.flow-title{font-size:clamp(22px,3vw,30px);font-weight:700;color:var(--navy);letter-spacing:-.01em;margin-bottom:22px}
.flow-sub{font-size:13.5px;color:var(--muted);margin:-12px 0 22px}
.fl-btns{display:flex;flex-wrap:wrap;gap:8px}
.fl-tag{font-size:11.5px;font-weight:600;color:#fff;border-radius:999px;padding:3px 10px;background:var(--tc)}
.fl-link{font-size:12px;padding:5px 11px;border-color:var(--c);color:var(--c)}
.fl-link:hover{background:var(--c);color:#fff;border-color:var(--c)}
/* legenda */
.fx-leg{display:flex;flex-wrap:wrap;gap:10px 22px;margin:-8px 0 26px;font-size:12.5px;color:var(--muted)}
.fx-leg span{display:flex;align-items:center;gap:8px}
.fx-leg i{display:inline-block;width:26px;height:16px}
.lg-step{border:1px solid var(--line);border-radius:5px;box-shadow:inset 3px 0 0 var(--bl);background:var(--panel)}
.lg-dec{background:rgba(155,0,255,.18);clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%)}
.lg-br{background:var(--soft);border-radius:3px;box-shadow:inset 3px 0 0 #E1254B}
/* diagrama: coluna central = caminho principal, direita = desvios */
.fx{--mw:320px;display:flex;flex-direction:column}
.fx-row{display:grid;grid-template-columns:var(--mw) minmax(0,520px);align-items:center}
.fx-main{display:flex;justify-content:center}
.fx-term{background:var(--navy);color:var(--panel);font-size:13px;font-weight:700;border-radius:999px;padding:10px 24px;text-align:center}
.fx-step{width:100%;display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px;background:var(--panel);color:var(--text);text-align:left;box-shadow:inset 4px 0 0 var(--c)}
.fx-step:hover{border-color:var(--c);color:var(--text);box-shadow:inset 4px 0 0 var(--c),0 8px 20px -10px rgba(20,0,117,.35)}
.fx-step .fn-n{flex:0 0 auto;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:13px;font-weight:700;background:var(--c)}
.fx-st{flex:1;font-size:14px;font-weight:600;color:var(--c);line-height:1.3}
.fx-open{font-size:11px;font-weight:600;color:var(--muted)}
.fx-dec{width:100%;min-height:66px;display:grid;place-items:center;text-align:center;padding:12px 36px;font-size:13.5px;font-weight:700;line-height:1.35;color:var(--text);background:rgba(155,0,255,.12);clip-path:polygon(22px 0,calc(100% - 22px) 0,100% 50%,calc(100% - 22px) 100%,22px 100%,0 50%)}
.fx-conn{width:var(--mw);height:36px;position:relative}
.fx-conn::before{content:'';position:absolute;left:50%;top:0;bottom:6px;width:2px;margin-left:-1px;background:var(--muted);opacity:.55}
.fx-conn::after{content:'';position:absolute;left:50%;bottom:0;margin-left:-6px;border:6px solid transparent;border-top:7px solid var(--muted);border-bottom:0;opacity:.8}

/* ===== ESTADO E ATALHOS ===== */
const KEY = 'updown-atendimento-v2';
let cur = 0;
const rail = document.getElementById('rail'), card = document.getElementById('card');


/* ===== DESENHO DA TRILHA, DO CARTAO E DOS PAINEIS ===== */
function renderRail(){
  rail.innerHTML = '';
  STEPS.forEach((s,i)=>{
    const b = document.createElement('button');
    b.style.color = s.c;
    b.setAttribute('aria-current', i===cur ? 'true':'false');
    b.title = s.n+'. '+s.t;
    b.innerHTML = '<span class="num" style="background:'+s.c+'">'+s.n+'</span><span class="lb">'+s.t+'</span>';
    b.onclick = ()=>{ cur=i; render(); };
    rail.appendChild(b);
  });
}
/* Clique no print: abre em tela cheia; clique ou Esc fecha */
function openZoom(img){
  const o = document.createElement('div');
  o.className = 'zoom';
  o.innerHTML = '<img src="'+img.src+'" alt="'+img.alt+'">';
  o.onclick = ()=> o.remove();
  document.body.appendChild(o);
}
function renderCard(){
  const s = STEPS[cur];
  const lis = s.items.map(it => {
    const sub = it.sub ? '<ul class="sub">'+it.sub.map(x=>'<li>'+x+'</li>').join('')+'</ul>' : '';
    const code = it.code ? '<pre class="log-ex">'+it.code+'</pre>' : '';
    const sigList = rows => '<div class="sig">'+rows.map(x=>'<div class="sig-row" style="--sc:'+x.c+'"><span class="sig-r">'+x.r+'</span><span class="sig-l">'+x.l+'</span>'+(x.d?'<span class="sig-d">'+x.d+'</span>':'')+'</div>').join('')+'</div>';
    const sig = (it.signal ? sigList(it.signal) : '')
      + (it.sigs ? it.sigs.map(g=>'<div class="sig-g"><p class="sig-h">'+g.h+'</p>'
          + (g.p?'<p class="sig-p">'+g.p+'</p>':'')
          + (g.list?'<ul class="sub">'+g.list.map(x=>'<li>'+x+'</li>').join('')+'</ul>':'')
          + (g.img?'<figure class="shot"><img src="'+IMGS[g.img]+'" alt="'+plain(g.h)+'" title="Clique para ver em tela cheia" onclick="openZoom(this)">'+(g.imgcap?'<figcaption>'+g.imgcap+'</figcaption>':'')+'</figure>':'')
          + (g.imgs?'<div class="shots2">'+g.imgs.map(([k,lb,cap])=>'<figure class="shot"><span class="shot-t">'+lb+'</span><img src="'+IMGS[k]+'" alt="'+plain(g.h)+' · '+lb+'" title="Clique para ver em tela cheia" onclick="openZoom(this)">'+(cap?'<figcaption>'+cap+'</figcaption>':'')+'</figure>').join('')+'</div>':'')
          + (g.rows?sigList(g.rows):'')
          + (g.chips?'<div class="sig-chips">'+g.chips.map(c=>'<span><small>'+c[0]+'</small><b>'+c[1]+'</b></span>').join('')+'</div>':'')
          + '</div>').join('') : '');
    const note = it.note ? '<p class="inote">'+it.note+'</p>' : '';
    const sub2 = it.sub2 ? '<ul class="sub">'+it.sub2.map(x=>'<li>'+x+'</li>').join('')+'</ul>' : '';
    const tag = it.hi ? '<span class="hi-tag">Em ligação</span>' : '';
    const shots = (it.img ? [[it.img, it.imgcap]] : []).concat(it.imgs || []);
    const img = shots.map(([k,cap])=>'<figure class="shot"><img src="'+IMGS[k]+'" alt="'+plain(it.h)+'" title="Clique para ver em tela cheia" onclick="openZoom(this)">'+(cap?'<figcaption>'+cap+'</figcaption>':'')+'</figure>').join('');
    const pairs = it.pairs ? '<div class="pairs">'+it.pairs.map(p=>'<span class="'+(p[1].startsWith('5')?'p5':'p24')+'"><b>'+p[0]+'</b>'+p[1]+'</span>').join('')+'</div>' : '';
    const det = sub+pairs+img+sig+note+sub2+code;
    if (it.fold && det) return '<li class="fold'+(it.hi?' is-hi':'')+'"><div class="li-body"><button class="li-h fold-h" aria-expanded="false"><span>'+it.h+tag+'</span><span class="chev">+</span></button><div class="fold-body">'+det+'</div></div></li>';
    return '<li'+(it.hi?' class="is-hi"':'')+'><div class="li-body"><span class="li-h">'+it.h+tag+'</span>'+det+'</div></li>';
  }).join('');
  const acc = (s.topics||[]).map((t,j)=>'<div class="acc"><button class="acc-h" aria-expanded="false" data-j="'+j+'"><span>'+t.name+'</span><span class="chev">+</span></button><div class="panel" id="panel-'+j+'"></div></div>').join('');
  card.style.setProperty('--acc', s.c);
  card.innerHTML = '<span class="etapa">Etapa '+s.n+' de '+STEPS.length+'</span><h2 style="color:'+s.c+'">'+s.t+'</h2><ol style="--acc:'+s.c+'">'+lis+'</ol>'+(acc?'<div class="accs" style="--acc:'+s.c+'">'+acc+'</div>':'')
    +(s.tool==='logs'?logsHTML(s):'');
  card.querySelectorAll('.fold-h').forEach(b=>{
    b.onclick = ()=>{
      const open = b.getAttribute('aria-expanded')==='true';
      b.setAttribute('aria-expanded', open ? 'false' : 'true');
      b.querySelector('.chev').textContent = open ? '+' : '−';
      b.nextElementSibling.classList.toggle('on', !open);
    };
  });
  card.querySelectorAll('.acc-h').forEach(p=>{
    p.onclick = ()=>{
      const j = +p.dataset.j;
      const panel = document.getElementById('panel-'+j);
      const open = p.getAttribute('aria-expanded')==='true';
      p.setAttribute('aria-expanded', open ? 'false' : 'true');
      p.querySelector('.chev').textContent = open ? '+' : '−';
      if (open){ panel.innerHTML=''; panel.classList.remove('on'); return; }
      const t = STEPS[cur].topics[j];
      panel.innerHTML = t.blocks.map(bk => '<div class="block"><h3>'+bk.h+'</h3><ul>'+bk.items.map(x=>'<li>'+x+'</li>').join('')+'</ul></div>').join('');
      panel.classList.add('on');
    };
  });
}
function renderMeta(){
  document.getElementById('pbar').style.width = ((cur+1)/STEPS.length*100)+'%';
  document.getElementById('pstep').textContent = 'Etapa '+(cur+1)+' de '+STEPS.length;
  document.getElementById('prev').disabled = cur===0;
  document.getElementById('next').textContent = cur===STEPS.length-1 ? 'Voltar ao início' : 'Próxima etapa →';
}
function render(){ renderRail(); renderCard(); renderMeta(); }
document.getElementById('prev').onclick = ()=>{ if(cur>0){cur--;render();} };
document.getElementById('next').onclick = ()=>{ cur = cur===STEPS.length-1 ? 0 : cur+1; render(); window.scrollTo({top:0,behavior:'smooth'}); };

/* ===== LEITURA DE LOGS (etapa de verificacao) ===== */
function logsHTML(s){
  const groups = (s.logGroups||[]).map(g =>
    '<div class="logs" style="--acc:'+s.c+'"><p class="logs-h">'+g.title+'</p><div class="logcards">'
    + g.types.map(t =>
        '<div class="logcard" style="--lc:'+t.c+'">'
        + '<div class="logcard-top"><span class="logdot"></span><b>'+t.k+'</b></div>'
        + '<p class="log-d">'+t.d+'</p>'
        + (t.m ? '<p class="log-m"><b>Motivo:</b> '+t.m+'</p>' : '')
        + (t.a ? '<p class="log-m"><b>Ação:</b> '+t.a+'</p>' : '')
        + (t.o ? '<p class="log-m"><b>OBS:</b> '+t.o+'</p>' : '')
        + '</div>').join('')
    + '</div>'
    + (g.note ? '<p class="log-note"><b>OBS:</b> '+g.note+'</p>' : '')
    + '</div>').join('');
  return groups;

     {"tag": "Boletos / Mudança / Dúvidas", "c": "#9B00FF", "t": "Resolver no próprio atendimento", "go": 6}]},

  {"q": "Resolveu nos testes com o cliente?", "next": "Sim", "br": [

  {"step": 7},
  {"term": "Fim do atendimento"}
];
function plain(h){ return h.replace(/<[^>]+>/g,'').replace(/:\s*$/,''); }
function renderFlow(){
  const btns = go => (Array.isArray(go) ? go : [[go, '']]).map(([g,l])=>'<button class="fl-link" style="--c:'+STEPS[g-1].c+'" data-go="'+g+'">'+(l?l+' · ':'')+g+'ª etapa →</button>').join('');
  const rows = FLOW.map((f,i)=>{
    let main;
    if (f.term) main = '<div class="fx-term">'+f.term+'</div>';
    else if (f.step){ const s = STEPS[f.step-1]; main = '<button class="fx-step" style="--c:'+s.c+'" data-go="'+s.n+'"><span class="fn-n">'+s.n+'</span><span class="fx-st">'+s.t+'</span><span class="fx-open">Abrir →</span></button>'; }
    else main = '<div class="fx-dec">'+f.q+'</div>';
    const br = f.br ? '<div class="fx-brs">'+f.br.map(b=>'<div class="fx-b" style="--tc:'+b.c+'"><span class="fx-arr"></span><div class="fx-bc"><span class="fl-tag">'+b.tag+'</span><p>'+b.t+'</p>'
      + (b.go ? '<div class="fl-btns">'+btns(b.go)+'</div>' : '')+'</div></div>').join('')+'</div>' : '';
    const conn = i<FLOW.length-1 ? '<div class="fx-conn">'+(f.next?'<span class="fx-lbl">'+f.next+'</span>':'')+'</div>' : '';
    return '<div class="fx-row"><div class="fx-main">'+main+'</div>'+br+'</div>'+conn;
  }).join('');
  flowView.innerHTML = '<p class="flow-title">Fluxograma do processo</p>'
    + '<div class="fx-leg"><span><i class="lg-step"></i>Etapa (clique para abrir)</span><span><i class="lg-dec"></i>Decisão</span><span><i class="lg-br"></i>Desvio do caminho</span></div>'
    + '<div class="fx">'+rows+'</div>';
  flowView.querySelectorAll('[data-go]').forEach(b=> b.onclick = ()=> goStep(+b.dataset.go-1));
}
function goStep(i){ cur = i; showFlow = showOnb = showTut = false; setView(false,false,false); render(); }

/* ===== PESQUISA =====
   Procura em todas as etapas: itens, subtopicos, tabelas, legendas, abas e logs.
   Ignora acentos e maiusculas. Clique no resultado abre a etapa e o item. */
const q = document.getElementById('q'), sres = document.getElementById('sres');
const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
/* versao sem acento com o mesmo tamanho do texto original (para marcar o trecho encontrado) */
const normSame = s => [...s].map(ch => ch.normalize('NFD')[0].toLowerCase()).join('');
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let INDEX = null, hits = [], sel = -1;
function buildIndex(){
  const rowTxt = r => r.r+' '+r.l+' '+(r.d||'');
  const out = [];
  STEPS.forEach((s,si)=>{
    s.items.forEach((it,ii)=>{
      const parts = [it.h].concat(it.sub||[], it.sub2||[], it.note||'', it.imgcap||'',
        (it.imgs||[]).map(x=>x[1]), (it.signal||[]).map(rowTxt), (it.pairs||[]).map(p=>p.join(' ')),
        (it.sigs||[]).flatMap(g=>[g.h, g.p||'', g.imgcap||''].concat(g.list||[], (g.imgs||[]).map(x=>x[1]+' '+x[2]), (g.rows||[]).map(rowTxt))));
      out.push({si, kind:'item', ii, title: plain(it.h), text: parts.map(plain).filter(Boolean).join(' · ')});
    });
    (s.topics||[]).forEach((t,tj)=> out.push({si, kind:'topic', tj, title: t.name,
      text: t.blocks.flatMap(b=>[b.h].concat(b.items)).map(plain).join(' · ')}));
    (s.logGroups||[]).forEach(g=> g.types.forEach(t=> out.push({si, kind:'log', k:t.k, title: g.title+': '+t.k,
      text: [t.d, t.m||'', t.a||'', t.o||''].map(plain).filter(Boolean).join(' · ')})));
  });
  TUTS.forEach((T,ti)=> T.blocks.forEach(b=> out.push({kind:'tut', ti, bid:b.id, where:'Tutorial · '+T.name, title:b.t,
    text: b.steps.map(plain).join(' · ')})));
  out.forEach(o=>{ o.nt = norm(o.title); o.nx = norm(o.text); });
  return out;
}
function mark(txt, terms){
  const n = normSame(txt); const hitAt = new Array(txt.length).fill(false);
  terms.forEach(t=>{ let i = n.indexOf(t); while(i>=0){ for(let k=i;k<i+t.length;k++) hitAt[k]=true; i = n.indexOf(t, i+t.length); } });
  let html = '', open = false;
  [...txt].forEach((ch,i)=>{ if(hitAt[i] && !open){ html += '<mark>'; open = true; } if(!hitAt[i] && open){ html += '</mark>'; open = false; } html += esc(ch); });
  return html + (open ? '</mark>' : '');
}
function snippet(txt, terms){
  const n = normSame(txt); let at = -1;
  terms.forEach(t=>{ const i = n.indexOf(t); if(i>=0 && (at<0 || i<at)) at = i; });
  if (at < 0) return mark(txt.slice(0,110), terms) + (txt.length>110?'…':'');
  const a = Math.max(0, at-40), b = Math.min(txt.length, at+80);
  return (a>0?'…':'') + mark(txt.slice(a,b), terms) + (b<txt.length?'…':'');
}
function search(){
  const terms = norm(q.value.trim()).split(/\s+/).filter(Boolean);
  sel = -1;
  if (!terms.length){ sres.hidden = true; q.setAttribute('aria-expanded','false'); return; }
  INDEX = INDEX || buildIndex();
  hits = INDEX.filter(o => terms.every(t => o.nt.includes(t) || o.nx.includes(t)))
    .sort((x,y) => terms.filter(t=>y.nt.includes(t)).length - terms.filter(t=>x.nt.includes(t)).length)
    .slice(0, 12);
  sres.innerHTML = hits.length
    ? hits.map((o,i)=>{ const s = o.kind==='tut' ? {c:'var(--pu)'} : STEPS[o.si];
        const where = o.kind==='tut' ? esc(o.where) : s.n+'. '+esc(s.t)+(o.kind==='topic'?' · aba':o.kind==='log'?' · logs':'');
        return '<button type="button" role="option" data-i="'+i+'" style="--c:'+s.c+'"><span class="r-where">'+where+'</span>'
          +'<span class="r-title">'+mark(o.title, terms)+'</span>'+(o.text?'<span class="r-snip">'+snippet(o.text, terms)+'</span>':'')+'</button>'; }).join('')
    : '<p class="r-none">Nada encontrado para “'+esc(q.value.trim())+'”. Tente outra palavra.</p>';
  sres.hidden = false; q.setAttribute('aria-expanded','true');
  sres.querySelectorAll('button').forEach(b=> b.onclick = ()=> openHit(hits[+b.dataset.i]));
}
function openHit(o){
  sres.hidden = true; q.blur();
  if (o.kind==='tut'){
    tutCur = o.ti; showTut = true; showFlow = showOnb = false; renderTut(); setView(false,false,true);
    const sec = document.getElementById('tut-'+o.bid);
    if (sec){ setTimeout(()=>{ sec.scrollIntoView({block:'start', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'}); sec.classList.remove('flash'); void sec.offsetWidth; sec.classList.add('flash'); }, 350); }
    return;
  }
  goStep(o.si);
  let el = null;
  if (o.kind==='item'){
    el = card.querySelectorAll('ol>li')[o.ii];
    const f = el && el.querySelector('.fold-h');
    if (f && f.getAttribute('aria-expanded')!=='true') f.click();
  } else if (o.kind==='topic'){
    const h = card.querySelector('.acc-h[data-j="'+o.tj+'"]');
    if (h && h.getAttribute('aria-expanded')!=='true') h.click();
    el = h && h.closest('.acc');
  } else {
    el = [...card.querySelectorAll('.logcard')].find(c => c.querySelector('b').textContent===o.k);
  }
  if (el){
    el.scrollIntoView({block:'center', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'});
    el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
  }
}
function moveSel(d){
  const bs = [...sres.querySelectorAll('button')]; if (!bs.length) return;
  sel = (sel + d + bs.length) % bs.length;
  bs.forEach((b,i)=> b.classList.toggle('on', i===sel));
  bs[sel].scrollIntoView({block:'nearest'});
}
q.addEventListener('input', search);
q.addEventListener('focus', ()=>{ if (q.value.trim()) search(); });
q.addEventListener('keydown', e=>{
  if (e.key==='ArrowDown'){ e.preventDefault(); moveSel(1); }
  else if (e.key==='ArrowUp'){ e.preventDefault(); moveSel(-1); }
  else if (e.key==='Enter'){ e.preventDefault(); const o = hits[sel<0?0:sel]; if (o) openHit(o); }
  else if (e.key==='Escape'){ if (q.value){ q.value=''; search(); } else q.blur(); sres.hidden = true; }
});
document.addEventListener('click', e=>{ if (!e.target.closest('.search')) sres.hidden = true; });

  if (e.key==='/'){ e.preventDefault(); q.focus(); q.select(); return; }
  if (showFlow || showOnb || showTut){ if (/^[1-7]$/.test(e.key)) goStep(+e.key-1); return; }
  if (e.key==='ArrowRight'){ if(cur<STEPS.length-1){cur++;render();} }
  else if (e.key==='ArrowLeft'){ if(cur>0){cur--;render();} }

});
