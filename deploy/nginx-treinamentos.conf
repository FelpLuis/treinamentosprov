# Treinamentos UPDOWN no nginx do servidor .13 (certificado com certbot).
server {
    listen 443 ssl http2;
    server_name treinamentos.updown.com.br;
    ssl_certificate     /etc/letsencrypt/live/treinamentos.updown.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/treinamentos.updown.com.br/privkey.pem;

    # vídeos e arquivos enviados pelos editores
    client_max_body_size 1100m;
    proxy_request_buffering off;

    location / {
        proxy_pass http://127.0.0.1:8791;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
server {
    listen 80;
    server_name treinamentos.updown.com.br;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}
